# dsh-recall-sessions bundle patch
#
# 这个文件由 DSH 的 dsh-plugin-manager 读取（package.json 里 `dsh.bundle.patch` 指向它），
# 内容会作为一个「补丁层」追加到 profile 的 cordis 层栈末尾。
#
# 顶层是一个 YAML 数组，数组里每一项要么是 `insert:`（往层栈里插新条目），
# 要么是 `- id: <已有条目>` + `config:`（覆盖已有条目的配置，按 key 整体替换）。
#
# 这里只做一件事：把自己插进层栈。
- insert:
    - id: dsh-recall-sessions
      name: 'dsh-recall-sessions'
      config:
        enabled: true
        # 默认按需加载：不自动把历史会话塞进上下文。
        # 改成 true 就恢复「开局自动带上最近几个会话摘要」的行为。
        autoInject: false
        # autoInject=true 时才有意义：最多带几个会话、每个渲染最后几轮。
        maxSessions: 3
        maxTurnsPerSession: 4
        # 清单模式一次最多列出多少个会话。
        maxListSessions: 20
        # 详情模式最多渲染多少轮、单条内容多少字符。
        maxDetailTurns: 30
        maxDetailChars: 1200
        # 摘要块在系统提示词上下文里的排序位置（沙箱策略是 110，这里排在它前面）。
        # 只在 autoInject=true 时生效。
        order: 108
        verbose: false
