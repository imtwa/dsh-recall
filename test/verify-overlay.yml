# 临时 overlay：只为验证 dsh-recall 是否真的把跨会话记忆注入了系统提示词。
#
# headless profile 默认走 deepseek-official，需要 DEEPSEEK_API_KEY；
# 如果没有那个环境变量，可以把这段改成指向一个本机已配好凭证的 provider。
# 只是测试用，不影响 web profile。
#
# 用法（任选其一）：
#   1) 导出凭证：export DEEPSEEK_API_KEY=sk-...   然后 --patch <本文件>
#   2) 把下面的 provider / model 改成你本机已有的（`dsh --profile web --dump-config` 里看得到），
#      以及对应的 apiKeyEnv。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      workbuddy2api-hub:
        apiKeyEnv: WORKBUDDY2API_HUB_API_KEY
        api: openai-completions
        baseURL: https://workbuddy2api-hub.zyca.top/v1
        reasoning: low
        defaultInput:
          - text
        models:
          - id: deepseek-v4.1-flash
            name: Deepseek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 128000
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: workbuddy2api-hub
    model: deepseek-v4.1-flash
    reasoningEffort: low
